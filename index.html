<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin-top: 20px;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Lịch họp công ty</h1>

    <table>
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>
        
        <!-- Thứ Hai: Có 2 cuộc họp nên dùng rowspan="2" ở cột Ngày -->
        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 10:00</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>
        <tr>
            <td>14:00 - 16:00</td>
            <td>Gặp gỡ khách hàng</td>
        </tr>

        <!-- Thứ Ba: Cuộc họp kéo dài cả ngày nên dùng colspan="2" để gộp cột Giờ và Nội dung -->
        <tr>
            <td>Thứ Ba</td>
            <td colspan="2">Đào tạo nhân sự mới (08:00 - 17:00)</td>
        </tr>

        <!-- Thứ Tư: Có 3 cuộc họp nên dùng rowspan="3" ở cột Ngày -->
        <tr>
            <td rowspan="3">Thứ Tư</td>
            <td>09:00 - 10:30</td>
            <td>Phỏng vấn ứng viên</td>
        </tr>
        <tr>
            <td>13:30 - 15:00</td>
            <td>Họp phòng Marketing</td>
        </tr>
        <tr>
            <td>15:30 - 17:00</td>
            <td>Họp ban Giám đốc</td>
        </tr>
    </table>

</body>
</html>
